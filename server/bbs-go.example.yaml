Env: prod # 环境，线上环境：prod、测试环境：dev
BaseUrl: https://www.qsc.zju.edu.cn/bbs2 # 完整站点地址，包含协议和访问前缀
Port: 8082 # 端口
LogFile: /data/logs/bbs-go.log # 日志文件
ShowSql: false # 是否打印sql
StaticPath: /data/www  # 根路径下的静态文件目录，可配置绝对路径

# 生产配置只启用 Passport。生产构建不会编译或注册密码登录路由。
LoginMethods:
  passport: true
  password: false

# 对象存储
MinIO:
  Endpoint: <minio-host:9000> # 只能写 host:port，不带协议
  AccessKeyID: <对象存储访问密钥>
  SecretAccessKey: <对象存储私钥>
  UserSSL: false
  BucketLocation: us-east-1

# 数据库连接
DB:
  Url: <用户名>:<密码>@tcp(<数据库主机>:3306)/bbsgo_db?charset=utf8mb4&parseTime=True&loc=Local
  MaxIdleConns: 50
  MaxOpenConns: 200

# 当前代码启动时要求 OldDB 可连接；没有旧库时可暂时指向主库
OldDB:
  Url: <用户名>:<密码>@tcp(<数据库主机>:3306)/bbsgo_db?charset=utf8mb4&parseTime=True&loc=Local

# 在线用户状态（不可用时在线列表自动隐藏，不影响登录和浏览）
Redis:
  Url: redis:6379
  Password: ""
  DB: 0

Presence:
  AllowedOrigins:
    - https://www.qsc.zju.edu.cn
  # 仅这些反向代理来源允许提供 X-Forwarded-For；请按部署网络收窄
  TrustedProxies:
    - 127.0.0.1/32
    - 172.16.0.0/12
  MaxConnections: 10000
  # 校园网常在 NAT 地址池后共享出口地址，单 IP 并发上限不宜过低。
  # 填 <=0 会被重置为默认值 200；想彻底放开可填一个很大的数。
  MaxConnectionsPerIP: 200
  MaxConnectionsPerUser: 5

# 搜索（Meilisearch）。Enabled 为 false 或 Meilisearch 不可用时，搜索自动回退到数据库 LIKE。
# 旧 BBS 数据量大，默认不同步；首次上线可临时把 SyncOldBBS 置为 true，或调用
# POST /api/admin/search/reindex 手动触发重建。
Search:
  Enabled: true
  Url: http://bbs-meilisearch:7700
  ApiKey: <Meilisearch 主密钥，仅后端可访问>
  Index: topics
  # filter：搜索结果只返回当前用户有权访问的主题；mark：返回全部命中主题，由渲染层隐藏无权内容
  PermissionMode: filter
  MaxLimit: 50
  MaxPage: 100
  MaxScan: 1000
  TimeoutMs: 3000
  SyncOnBoot: true
  SyncOldBBS: false
