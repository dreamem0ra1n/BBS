services:
  bbs-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - bbs_redis_data:/data
    networks:
      - default
    restart: unless-stopped

  # 搜索服务。后端通过 Search.Url 访问，不对外暴露端口。
  bbs-meilisearch:
    image: getmeili/meilisearch:v1.6
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-change-me-in-production}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - bbs_meili_data:/meili_data
    networks:
      - default
    restart: unless-stopped

  bbs_admin:
    image: bbs_neo_admin
    ports:
      - "8080:8080"
    networks:
      - traefik_net
      - default
    restart_policy:
      condition: on-failure
    labels:
        - "traefik.tags=http"
        - "traefik.port=8080"
        - "traefik.protocol=http"
        - "traefik.docker.network=traefik_net"
        - "traefik.backend=bbs_admin"
        - "traefik.frontend.rule=Host:admin.bbss.zjuqsc.com"

  bbs_frontend:
    image: bbs_neo_site
    ports:
      - "3000:3000"
    networks:
      - traefik_net
      - default
    restart_policy:
      condition: on-failure
    labels:
        - "traefik.tags=http"
        - "traefik.port=3000"
        - "traefik.protocol=http"
        - "traefik.docker.network=traefik_net"
        - "traefik.backend=bbs_frontend"
        - "traefik.frontend.rule=Host:bbss.zjuqsc.com"

  bbs_backend:
    image: bbs_neo_backend
    ports:
      - "8082:8082"
    networks:
      - traefik_net
      - default
    configs:
      - source: bbs_neo_config
        target: /bbs-go.yaml
        mode: 0440
    depends_on:
      - bbs-redis
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    labels:
        - "traefik.tags=http"
        - "traefik.port=8082"
        - "traefik.protocol=http"
        - "traefik.docker.network=traefik_net"
        - "traefik.backend=bbs_backend"
        - "traefik.frontend.rule=Host:api.bbss.zjuqsc.com"
        # Traefik 会透传 WebSocket Upgrade；生产环境请将后端 idle timeout
        # 设置为至少 90 秒（与 presence TTL 相匹配）。

configs:
  bbs_neo_config:
    external: true

networks:
  traefik_net:
    external: true

volumes:
  bbs_redis_data:
  bbs_meili_data:
